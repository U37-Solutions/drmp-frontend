name: 🚀📤 Push [develop]
 
on:
  workflow_dispatch:
  push:
    branches: ["develop"]

env:
  NAMESPACE: drmp
  PROJECT_NAME: frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to private registry
        uses: ./.github/actions/login-to-docker-registry
        with:
          DOCKER_REGISTRY_URL: ${{ vars.DOCKER_REGISTRY_URL }}
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: ./.github/actions/build-and-push
        with:
          DOCKER_REGISTRY_NAME: ${{ vars.DOCKER_REGISTRY_NAME }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_MAP_API_KEY: ${{ secrets.NEXT_PUBLIC_MAP_API_KEY }}
          NEXT_PUBLIC_LIGHT_MAP_ID: ${{ secrets.NEXT_PUBLIC_LIGHT_MAP_ID }}
          NEXT_PUBLIC_DARK_MAP_ID: ${{ secrets.NEXT_PUBLIC_DARK_MAP_ID }}
          NAMESPACE: ${{ env.NAMESPACE }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy deployment and Check deployment trigger
        uses: ./.github/actions/deploy
        with:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DEPLOY_APP_ID: ${{ secrets.DEPLOY_APP_ID }}
